

 <div class="container text-center position-relative bg-image">
  <h1 class="h1 ods position-absolute top-50 start-50 translate-middle">Online Dance Studio</h1>
</div>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 login-box">
      <form (ngSubmit)="login()">
        <h2>Login</h2>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" class="form-control" id="username" placeholder="Enter username" [(ngModel)]="username" name="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" [(ngModel)]="password" name="password">
        </div>
        <button type="submit" class="btn btn-primary mt-2">Login</button>
        <div *ngIf="errorMessage" class="alert alert-danger mt-3" role="alert">
          {{ errorMessage }}
        </div>
      </form>
    </div>
  </div>
</div>
